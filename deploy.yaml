apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capstone-app
  template:
    metadata:
      labels:
        app: capstone-app
    spec:
      containers:
        - name: capstone
          image: capstone-app:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
