<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Molecule Leaderboard - Rivas Molecules</title>
    <link rel="stylesheet" href="https://unpkg.com/bulma@1.0.2/css/bulma.min.css">
    <link rel="stylesheet" type="text/css" href="/static/css/showcase.css">
    <script src="https://kit.fontawesome.com/2828f7885a.js"
        integrity="sha384-WAsFbnLEQcpCk8lM1UTWesAf5rGTCvb2Y+8LvyjAAcxK1c3s5c0L+SYOgxvc6PWG"
        crossorigin="anonymous"></script>
</head>

<body style="background-color: #2c3e50;">
    <!-- Navigation -->
    <nav class="navbar is-fixed-top is-dark">
        <div class="navbar-brand">
            <a class="navbar-item" href="/">
                Rivas Molecules
            </a>
        </div>
        <div class="navbar-menu">
            <div class="navbar-end">
                <a class="navbar-item" href="/">Home</a>
                <a class="navbar-item" href="/leaderboard">Leaderboard</a>
            </div>
        </div>
    </nav>

    <!-- Leaderboard Section -->
    <section class="section" style="padding-top: 5rem;">
        <div class="container">
            <h1 class="title has-text-centered" style="color: #ecf0f1; font-size: 2.5rem; margin-bottom: 3rem;">
                Molecule Leaderboard
            </h1>

            <div class="box" style="background: rgba(236, 240, 241, 0.1); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
                <table class="table is-fullwidth" style="background: transparent;">
                    <thead>
                        <tr>
                            <th style="color: #ecf0f1;">Rank</th>
                            <th style="color: #ecf0f1;">User</th>
                            <th style="color: #ecf0f1;">Score</th>
                            <th style="color: #ecf0f1;">Date</th>
                            <th style="color: #ecf0f1;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for submission in submissions %}
                        <tr>
                            <td style="color: #ecf0f1;">{{ loop.index }}</td>
                            <td style="color: #ecf0f1;">{{ submission.user_name }}</td>
                            <td style="color: #ecf0f1;">{{ "%.2f"|format(submission.score) }}</td>
                            <td style="color: #ecf0f1;">{{ submission.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
                            <td>
                                <a href="{{ url_for('view_molecule', submission_id=submission.id) }}"
                                   class="button is-small is-info">
                                    View Molecule
                                </a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</body>

</html>
